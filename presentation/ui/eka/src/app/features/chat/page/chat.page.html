<!-- chat.component.html -->
<div class="chat-container">
  <div class="history-controls">
    <span *ngIf="isLoadingHistory">Loading conversation history...</span>
    <button mat-button type="button" (click)="clearHistory()" [disabled]="isSending || isLoadingHistory || !messages().length">
      Clear history
    </button>
  </div>
  <p class="error-message" *ngIf="historyError || requestError">{{ historyError || requestError }}</p>
  <div class="messages">
    <div *ngFor="let msg of messages()" [ngClass]="msg.role">
      <p>{{ msg.content }}</p>
    </div>
  </div>

  <div class="input-area">

<mat-form-field appearance="outline">
  <mat-label>Select Role</mat-label>
  <mat-select [(value)]="selectedRole">
    <mat-option *ngFor="let role of roles" [value]="role">
      {{ role }}
    </mat-option>
  </mat-select>
</mat-form-field>

     <mat-form-field appearance="outline" class="input-textarea">
    <mat-label>Ask Me...</mat-label>
       <input matInput [(ngModel)]="userInput" [disabled]="isSending || isLoadingHistory || !!historyError"/>
  </mat-form-field>
     <button mat-raised-button color="primary" (click)="sendMessage()" [disabled]="isSending || isLoadingHistory || !!historyError">Send</button>
 
  </div>

  <div class="kb-update">
    <mat-form-field appearance="outline">
      <mat-label>Select Roles</mat-label>
      <mat-select [(value)]="selectedRoleKB" multiple>
        <mat-option *ngFor="let role of roles" [value]="role">
          {{ role }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="document-field">
  <mat-label>Document</mat-label>
  <input
    matInput
    [value]="selectedDocument?.name ?? ''"
    placeholder="Choose a document"
    readonly
  />
  <button
    mat-button
    matSuffix
    type="button"
    (click)="fileInput.click()"
    [disabled]="isUploading"
  >
    Choose file
  </button>
</mat-form-field>

<input
  #fileInput
  type="file"
  hidden
  accept=".pdf,.docx,.txt,.ppt,.pptx,.bmp,.gif,.jpeg,.jpg,.png,.tif,.tiff,.webp"
  (change)="onDocumentSelected($event)"
  [disabled]="isUploading"
/>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="uploadDocument()"
      [disabled]="!selectedDocument || !selectedRoleKB.length || isUploading"
    >
      {{ isUploading ? 'Uploading...' : 'Upload document' }}
    </button>
  </div>
</div>
